spring.application.name=api-management-service
server.port=8081

info.app.name=API Management Service
info.app.description=Control plane for users, routes and gateway policies

spring.datasource.url=${NEXGATE_MYSQL_URL:jdbc:mysql://localhost:3306/nexgate_management}
spring.datasource.username=${NEXGATE_MYSQL_USERNAME:root}
spring.datasource.password=${NEXGATE_MYSQL_PASSWORD:change-me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations

security.jwt.expiration-seconds=${NEXGATE_JWT_EXPIRATION_SECONDS:3600}
security.jwt.secret=${NEXGATE_JWT_SECRET:replace-with-at-least-32-character-secret}

management.endpoints.web.exposure.include=health,info

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
nexgate.outbox.publish-delay-ms=${NEXGATE_OUTBOX_PUBLISH_DELAY_MS:5000}
