spring.application.name=analytics-service
server.port=8084

spring.data.mongodb.uri=${NEXGATE_MONGODB_URI:mongodb://localhost:27017/nexgate_analytics}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=nexgate-analytics
spring.kafka.consumer.auto-offset-reset=earliest

management.endpoints.web.exposure.include=health,info

nexgate.jwt.secret=${NEXGATE_JWT_SECRET:}
nexgate.jwt.issuer=${NEXGATE_JWT_ISSUER:gatekeeper-api-management}
