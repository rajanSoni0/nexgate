spring.application.name=api-management-service
server.port=8081

info.app.name = API Management Service
info.app.description = Management Service for users, routes and gateway policies

# ===============================
# MySQL Database Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/nexgate_management
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

security.jwt.expiration-seconds=3600
security.jwt.secret=gatekeeper-demo-jwt-secret-key-change-before-production
