spring.application.name=smart-gateway-service
server.port=8080

management.endpoints.web.exposure.include=health,info

nexgate.management.base-url=${NEXGATE_MANAGEMENT_BASE_URL:http://localhost:8081}
nexgate.management.username=${NEXGATE_GATEWAY_USERNAME:gateway-service}
nexgate.management.password=${NEXGATE_GATEWAY_PASSWORD:change-me}
nexgate.management.connect-timeout-ms=2000
nexgate.management.read-timeout-ms=5000

nexgate.correlation.header-name=${NEXGATE_CORRELATION_HEADER:X-Correlation-ID}
nexgate.correlation.max-length=128

nexgate.jwt.secret=${NEXGATE_JWT_SECRET:}
nexgate.jwt.issuer=${NEXGATE_JWT_ISSUER:gatekeeper-api-management}

spring.data.redis.url=${NEXGATE_REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms
nexgate.redis.url=${NEXGATE_REDIS_URL:redis://localhost:6379}
nexgate.idempotency.ttl-seconds=${NEXGATE_IDEMPOTENCY_TTL_SECONDS:86400}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=smart-gateway-route-refresh
spring.kafka.consumer.auto-offset-reset=earliest
